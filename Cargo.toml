[package]
name = "xl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A fast, terminal-based spreadsheet application written in Rust"
repository = "https://github.com/only-using-ai/rustxl"
readme = "README.md"

[dependencies]
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
ratatui = "0.30.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
# calamine reads the legacy formats (.xls) that umya does not; umya reads and
# writes .xlsx, which is what a round trip needs.
calamine = "0.24"
umya-spreadsheet = "3.0.1"
atty = "0.2"
dirs = "5.0"
arboard = "3.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
flate2 = "1.0"
tar = "0.4"

# umya-spreadsheet 3.0.1 as released loses every border on READ: the styles
# reader pushed default (all-none) Borders without parsing <border> children,
# a 3.0.0 refactor regression. Vendored with the one-line fix in
# structs/borders_crate.rs; drop this patch when upstream ships a release
# whose border roundtrip test below passes against crates.io.
[patch.crates-io]
umya-spreadsheet = { path = "vendor/umya-spreadsheet" }
